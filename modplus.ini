; =============================================================================
; Конфигурационный файл патчей MoTmod Plus (dinput8.dll)
; Игра: Смерть шпионам: Момент истины (Truth.exe v2.0.0.3)
; Положите modplus.ini в папку с игрой рядом с dinput8.dll и Truth.exe.
; Значения: 1 = патч включён (по-умолчанию), 0 = патч выключен.
; =============================================================================

[System]
; Разрешает игре использовать до 4 ГБ оперативной памяти на 64-битных ОС (флаг IMAGE_FILE_LARGE_ADDRESS_AWARE)
LargeAddressAware = 1

; Защита от вылетов (Access Violation 0xC0000005) при передаче пустых (NULL) дескрипторов строк в Lua-скриптах и роликах
NullPointerCrashFix = 1

; Защита от вылетов при открытии полноэкранной карты (M) или меню сохранений при отсутствии строки описания уровня
MapAndSaveStringCrashFix = 1

; Автоматическое создание и загрузка профиля по умолчанию (default) при первом запуске игры
AutoCreateDefaultProfile = 1

; Быстрый выход из игры без зависаний на деструкторах при закрытии процесса
ExitProcessCleanFix = 1


[Controls]
; Механика кобуры в стиле Hitman (клавиша H прячет/достаёт последнее оружие), приоритет удавки и сохранение в .ssv
HitmanWeaponHolster = 1

; Автоматическое взятие в руку следующего метательного ножа из инвентаря после броска
AutoDrawNextKnife = 1

; Стелс-оружие (удавка и хлороформ) в руке не считается открытым враждебным оружием и не выдаёт маскировку
StealthWeaponsCamouflageFix = 1

; Старт миссии и сброс состояния движения в режиме «Шаг» вместо «Бег»
StartInWalkMode = 1

; Поддержка средней (СКМ) и боковых кнопок мыши (Mouse 4 / Mouse 5), а также дополнительных биндов (поднятие тела, переодевание) в settings.scg
ExtraMouseButtonsAndBinds = 1

; Обновлённая раскладка управления по умолчанию и чувствительность мыши (0.675) для новых профилей
DefaultProfileKeybinds = 1

; Регулировка дистанции камеры клавишами «+» / «-» в игре, расширенный диапазон ползунка [25..60] и сохранение в settings.scg
CameraDistanceHotkeys = 1


[HUD]
; Широкоэкранное масштабирование (16:9 / 21:9) интерфейса, шрифтов, снайперских прицелов, меню и экрана брифинга
WidescreenAndUIScaling = 1

; Компактное контекстное меню действий (убирает лишний заголовок «ДЕЙСТВИЯ» и уменьшает верхнюю плашку)
CompactActionMenu = 1

; Раздельная прокрутка колёсиком мыши в брифинге: слева — прокрутка текста задания, справа — зум карты
BriefingSplitMouseWheel = 1

; Корректное масштабирование сетки ячеек инвентаря для высоких разрешений экрана
InventoryGridScaling = 1

; Русские подписи «Новое сохранение» и «Быстрое сохранение» в меню сохранений
SaveMenuRussianLabels = 1


[Compass]
; Масштабирование (зум) мини-карты/компаса колёсиком мыши пешком и в транспорте
MouseWheelCompassZoom = 1

; Обновлённая система компаса: круглая стенсил-маска, стороны света (N/E/S/W), индикаторы высоты (▲/▼) и фильтрация маркеров целей
CompassSystem = 1

; Направленная поворотная стрелка из hud_gbrief.tga на границе компаса вместо пустого круглого маркера (при 1 высота на границе не рисуется)
CompassBoundaryArrow = 1

; Скрывать индикатор высоты (▲/▼) у маркера на границе компаса (работает также если CompassBoundaryArrow = 0, оставляя высоту только для числовых маркеров внутри компаса)
CompassHideBoundaryHeight = 1


[Graphics]
; Разблокировка произвольных разрешений экрана (включая 3440x1440) и сглаживания 8x MSAA в настройках видео
CustomResolutionsAnd8xAA = 1

; Принудительная анизотропная фильтрация 16x AF на всех стадиях текстурирования и линейная фильтрация мип-уровней (убирает мельтешение сетки-рабицы и размытие текстур под углом)
Anisotropic16x = 1

; Исправление пикселизации объёмного тумана в подвалах: разрешение текстуры тумана 2048x2048 и фиксация краёв (D3DTADDRESS_BORDER) с VolumeFogNoC.dds
VolumeFogCellarFix = 1

; Глобальное отключение аппаратного тумана дальности (D3DRS_FOGENABLE = 0) во всех 13 проходах рендеринга (убирает мутную пелену/блюр вдали)
NoDistanceFog = 1
