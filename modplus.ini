; =============================================================================
; MoTmod Plus Patch Configuration (dinput8.dll)
; Game: Death to Spies: Moment of Truth (Truth.exe v2.0.0.3)
; Place modplus.ini in the game folder next to dinput8.dll and Truth.exe.
; Values: 1 = patch enabled (default), 0 = patch disabled.
; =============================================================================

[System]
; Note: 4 GB / LargeAddressAware must be patched on Truth.exe on disk (cannot be applied at runtime by dinput8.dll).

; Prevents crashes (Access Violation 0xC0000005) when NULL string descriptors are passed in Lua scripts and cutscenes
NullPointerCrashFix = 1

; Automatically creates and loads the default profile on first game launch
AutoCreateDefaultProfile = 1

; Clean fast game exit without hanging on destructors when closing the process
ExitProcessCleanFix = 1


[Controls]
; Hitman-style weapon holster mechanic (H key holsters/draws last weapon), garrote priority, and .ssv save support
HitmanWeaponHolster = 1

; Automatically draws the next throwing knife from inventory after throwing one
AutoDrawNextKnife = 1

; Stealth weapons (garrote and chloroform) held in hand are not treated as hostile weapons and do not blow disguise
StealthWeaponsCamouflageFix = 1

; Starts missions and resets movement state in Walk mode instead of Run
StartInWalkMode = 1

; Enables middle (MMB) and side mouse buttons (Mouse 4 / Mouse 5) plus extra bindings (carry body, disguise) in settings.scg
ExtraMouseButtonsAndBinds = 1

; Updated default control layout and mouse sensitivity (0.675) for newly created profiles
DefaultProfileKeybinds = 1

; Adjust camera distance in-game with '+' / '-', expanded slider range [25..60], saved in settings.scg
CameraDistanceHotkeys = 1


[HUD]
; Widescreen (16:9 / 21:9) scaling for HUD, fonts, sniper scopes, menus, and briefing screen
WidescreenAndUIScaling = 1

; Compact contextual action menu (removes redundant header and shrinks top bar)
CompactActionMenu = 1

; Split mouse-wheel scrolling on the briefing screen: left scrolls mission text, right zooms map
BriefingSplitMouseWheel = 1

; Proper inventory grid cell scaling for high screen resolutions
InventoryGridScaling = 1


[Compass]
; Minimap/compass zoom with mouse wheel on foot and in vehicles
MouseWheelCompassZoom = 1

; Overhauled compass: circular stencil mask, cardinal directions (N/E/S/W), height indicators, and objective marker filtering
CompassSystem = 1

; Directional rotating arrow from hud_gbrief.tga on the compass rim instead of a blank circular marker (hides rim height indicator when enabled)
CompassBoundaryArrow = 1

; Hides the height indicator on rim markers (also works when CompassBoundaryArrow = 0, keeping height arrows only for numbered markers inside the compass)
CompassHideBoundaryHeight = 1


[Graphics]
; Unlocks custom screen resolutions (including 3440x1440) and 8x MSAA in video settings
CustomResolutionsAnd8xAA = 1

; Forces 16x anisotropic filtering across all texture stages with linear mip filtering (eliminates fence shimmer and angled texture blur)
Anisotropic16x = 1

; Fixes pixelated cellar volumetric fog: 2048x2048 fog texture resolution and border clamping (D3DTADDRESS_BORDER) with VolumeFogNoC.dds
VolumeFogCellarFix = 1

; Globally disables hardware distance fog (D3DRS_FOGENABLE = 0) across all 13 render passes (removes distant haze/blur)
NoDistanceFog = 1

; Expands RenderServer dynamic buffers 4x (VB: 2 MB -> 8 MB, IB: 64,000 -> 256,000 triangles/frame) to prevent disappearing terrain and CTD with r_farclip > 5000
ExpandDynamicBuffers = 1

; Smart distant horizon haze (requires NoDistanceFog = 0): keeps 0..2475 units crystal clear and smoothly fades 2475..4320 into horizon sky color
DistantHorizonFog = 1

; Aligns SkyBox vertical horizon (Position.Y = 0.85 * Size * Scale.Y) so distant horizon textures sit at eye level on every mission (fixes Rasplata/Izyatie)
SkyHorizonAlign = 1
